<!DOCTYPE html>
<html>
<head>
    <title>Document Upload</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #dropzone {
            border: 2px dashed #007bff;
            padding: 40px;
            text-align: center;
            color: #007bff;
            border-radius: 8px;
        }
        #dropzone.dragover {
            background-color: #e9f5ff;
        }
        #log {
            height: 200px;
            overflow-y: auto;
            background: #111;
            color: #0f0;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body class="container py-4">
    {% csrf_token %}
    <h2>Upload Documents for Vector Store</h2>
    <p class="text-muted">Drag and drop DOCX, PDF, TXT, XLSX here.</p>

    <div id="dropzone">Drop files here or click to upload</div>
    <input id="fileInput" type="file" multiple style="display:none" />

    <h4 class="mt-4">Ingestion Log</h4>
    <div id="log"></div>

    <script>
        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const log = document.getElementById("log");

        function writeLog(msg) {
            log.textContent += msg + "\n";
            log.scrollTop = log.scrollHeight;
        }

        dropzone.addEventListener("click", () => fileInput.click());

        dropzone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropzone.classList.add("dragover");
        });

        dropzone.addEventListener("dragleave", () => {
            dropzone.classList.remove("dragover");
        });

        dropzone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropzone.classList.remove("dragover");
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener("change", () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            for (const file of files) {
                uploadFile(file);
            }
        }

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        function uploadFile(file) {
            writeLog("Uploading: " + file.name);

            const formData = new FormData();
            formData.append("file", file);

            fetch("{% url 'webapp:upload_file' %}", {
                method: "POST",
                headers: {"X-CSRFToken": csrfToken},
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                writeLog(data.message);
            })
            .catch(err => {
                writeLog("ERROR: " + err);
            });
        }
    </script>
</body>
</html>
