<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NASA Earth Action — Solution Co-Development Toolkit{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --earth-teal: #00a0b0;
            --earth-teal-light: #e6f7f9;
            --sidebar-width: 280px;
            --header-height: 64px;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --bg-page: #f5f7fa;
            --border: #d0d7e3;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-height);
            background: var(--nasa-blue);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 100;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
        }

        .site-header .hamburger {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.4rem;
            padding: 0.25rem 0.5rem;
            display: none;
        }

        .site-header .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: #fff;
        }

        .site-header .brand-badge {
            background: var(--nasa-red);
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
        }

        .site-header .brand-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .site-header .brand-subtitle {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* ── Layout ── */
        .layout {
            display: flex;
            padding-top: var(--header-height);
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            z-index: 90;
            transition: transform 0.25s ease;
        }

        .sidebar-inner {
            padding: 1rem 0 2rem;
        }

        .sidebar-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 0.75rem 1.25rem 0.4rem;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.25rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            line-height: 1.35;
        }

        .sidebar nav a .step-num {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--border);
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar nav a:hover {
            background: var(--earth-teal-light);
            color: var(--earth-teal);
            border-left-color: var(--earth-teal);
        }

        .sidebar nav a.active {
            background: var(--earth-teal-light);
            color: var(--nasa-blue);
            border-left-color: var(--nasa-blue);
            font-weight: 600;
        }

        .sidebar nav a.active .step-num {
            background: var(--nasa-blue);
            color: #fff;
        }

        /* ── Main content ── */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2.5rem 3rem;
            max-width: 960px;
        }

        .page-header {
            border-bottom: 3px solid var(--earth-teal);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .page-header .section-tag {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--earth-teal);
            margin-bottom: 0.4rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--nasa-blue);
            line-height: 1.2;
        }

        .content-placeholder {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            color: var(--text-secondary);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .site-header .hamburger { display: block; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1.5rem 1.25rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <button class="hamburger" id="menuToggle" aria-label="Toggle navigation">&#9776;</button>
    <a href="{% url 'webapp:home' %}" class="brand">
        <span class="brand-badge">NASA</span>
        <span>
            <div class="brand-title">Solution Co-Development Toolkit</div>
            <div class="brand-subtitle">NASA Earth Action &mdash; Marshall Space Flight Center</div>
        </span>
    </a>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-label">Toolkit Sections</div>
            <nav>
                {% for section in nav_sections %}
                <a href="{% url section.url_name %}"
                   class="{% if section.slug == active_slug %}active{% endif %}">
                    <span class="step-num">{{ forloop.counter }}</span>
                    {{ section.name }}
                </a>
                {% endfor %}
            </nav>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
    const toggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
</script>

</body>
</html>
